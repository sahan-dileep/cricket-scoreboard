<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky & Atmosphere Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040914"/>
      <stop offset="45%" stop-color="#0b1b36"/>
      <stop offset="75%" stop-color="#0d2440"/>
      <stop offset="100%" stop-color="#061826"/>
    </linearGradient>

    <!-- Floodlight Beams -->
    <linearGradient id="beamLeft1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#a5f3fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beamLeft2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beamRight1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#a5f3fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beamRight2" x1="90%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </linearGradient>

    <!-- Turf Grass Gradient -->
    <linearGradient id="turfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f3d2e" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#144d39"/>
      <stop offset="70%" stop-color="#0a2a1f"/>
      <stop offset="100%" stop-color="#04120d"/>
    </linearGradient>

    <!-- Radial Glow for Floodlight Towers -->
    <radialGradient id="towerGlowLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="20%" stop-color="#e0f2fe" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="towerGlowRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="20%" stop-color="#e0f2fe" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Stadium Silhouette Mist -->
    <linearGradient id="mistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- Deep Night Sky -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- Distant Stadium Stands Silhouettes -->
  <path d="M 0 540 Q 480 500 960 500 Q 1440 500 1920 540 L 1920 820 L 0 820 Z" fill="#06152b" opacity="0.9"/>
  <path d="M 0 580 Q 480 540 960 540 Q 1440 540 1920 580 L 1920 850 L 0 850 Z" fill="#040e1c" opacity="0.95"/>

  <!-- Stadium Crowd / Grandstand Lights Texture -->
  <g opacity="0.35">
    <ellipse cx="250" cy="560" rx="180" ry="12" fill="#38bdf8" filter="blur(8px)"/>
    <ellipse cx="650" cy="535" rx="220" ry="10" fill="#bae6fd" filter="blur(7px)"/>
    <ellipse cx="1270" cy="535" rx="220" ry="10" fill="#bae6fd" filter="blur(7px)"/>
    <ellipse cx="1670" cy="560" rx="180" ry="12" fill="#38bdf8" filter="blur(8px)"/>
  </g>

  <!-- Lush Outfield Turf Grass -->
  <path d="M 0 760 Q 480 720 960 720 Q 1440 720 1920 760 L 1920 1080 L 0 1080 Z" fill="url(#turfGrad)"/>
  <!-- Turf subtle mow lines -->
  <ellipse cx="960" cy="980" rx="900" ry="160" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.12"/>
  <ellipse cx="960" cy="920" rx="750" ry="130" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.15"/>
  <ellipse cx="960" cy="860" rx="600" ry="100" fill="none" stroke="#86efac" stroke-width="1.5" opacity="0.18"/>

  <!-- Atmospheric Light Beams from Left Floodlights -->
  <polygon points="120,40 650,1080 320,1080" fill="url(#beamLeft1)"/>
  <polygon points="120,40 1150,1080 750,1080" fill="url(#beamLeft2)"/>
  <polygon points="80,60 1600,1080 1200,1080" fill="url(#beamLeft1)" opacity="0.7"/>

  <!-- Atmospheric Light Beams from Right Floodlights -->
  <polygon points="1800,40 1270,1080 1600,1080" fill="url(#beamRight1)"/>
  <polygon points="1800,40 770,1080 1170,1080" fill="url(#beamRight2)"/>
  <polygon points="1840,60 320,1080 720,1080" fill="url(#beamRight1)" opacity="0.7"/>

  <!-- Light Flares / Halos on Floodlight Towers -->
  <!-- Left Tower Flares -->
  <circle cx="120" cy="60" r="160" fill="url(#towerGlowLeft)"/>
  <circle cx="120" cy="60" r="30" fill="#ffffff" opacity="0.95"/>
  <!-- Right Tower Flares -->
  <circle cx="1800" cy="60" r="160" fill="url(#towerGlowRight)"/>
  <circle cx="1800" cy="60" r="30" fill="#ffffff" opacity="0.95"/>

  <!-- Subtle Vignette & Overall Atmospheric Overlay -->
  <rect width="1920" height="1080" fill="url(#mistGrad)" style="mix-blend-mode: multiply;"/>
</svg>
